name: daily

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "feedparser==6.0.14" "PyYAML==6.0.3"

      - name: Fetch
        # Optional: set a repository variable CONTACT_EMAIL to join the OpenAlex
        # and Crossref polite pools. Unset, it is an empty string and ignored.
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python fetch.py

      - name: Commit data/ if it changed
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "data/ unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: daily fetch $(date -u +%Y-%m-%d)"
          git push
