# Radar sources. Every source here is reachable without an API key.
#
# Contact email: OpenAlex and Crossref give faster service to clients that
# identify themselves. fetch.py reads it from the CONTACT_EMAIL environment
# variable, which is unset by default. Never write an address in this file.

window_days: 90

arxiv:
  enabled: true
  endpoint: https://export.arxiv.org/api/query
  categories: [cs.AI, cs.MA, cs.CR, cs.DC, econ.GN, q-fin.GN]
  terms_per_query: 8      # keyword phrases OR-ed together per request
  max_results: 100        # per request
  min_interval: 3.0       # seconds between requests (arXiv's published limit)

openalex:
  enabled: true
  endpoint: https://api.openalex.org/works
  terms_per_query: 12
  per_page: 50
  min_interval: 1.0

crossref:
  enabled: true
  endpoint: https://api.crossref.org/works
  rows: 20                # per keyword phrase; Crossref matching is fuzzy
  min_interval: 1.0

federal_register:
  enabled: true
  endpoint: https://www.federalregister.gov/api/v1/documents.json
  terms_per_query: 10
  per_page: 50
  min_interval: 1.0

google_news:
  enabled: true
  endpoint: https://news.google.com/rss/search
  window: 7d              # Google News "when:" operator
  min_interval: 2.0
  # One query per topic. Results still have to clear the relevance floor.
  queries:
    - '"agentic commerce"'
    - '"agent payments" OR "agentic payments"'
    - 'x402 payments'
    - '"machine payments protocol" OR "agentic commerce protocol"'
    - '"Agent Payments Protocol" OR "trusted agent protocol"'
    - '"ERC-8004" OR "know your agent"'
    - 'stablecoin settlement AI agents'
    - '"agent wallet" OR "agentic wallet"'
    - 'tokenized compute'

hacker_news:
  enabled: true
  endpoint: https://hn.algolia.com/api/v1/search_by_date
  hits_per_page: 30
  min_interval: 0.5
  # Searched one phrase per request, from the relevance keyword list.

institutional:
  min_interval: 1.0
  summary_chars: 500      # feed summaries are trimmed; article bodies are never stored
  # Filled in by `python fetch.py --verify-feeds`. Only verified: true feeds are
  # fetched. Do not hand-edit a URL to verified: true without checking it.
  orgs:
    - name: BlackRock
      landing: https://www.blackrock.com/corporate/insights/blackrock-investment-institute
      feed: null
      verified: false
      verified_on: '2026-11-19'
      reason: 'no working feed: landing page links no feed; /feed, /rss, /feed.xml, /blog/rss.xml and /corporate/rss all 404. BlackRock publishes no public RSS for BII research'
